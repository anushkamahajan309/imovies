<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMovies - Movie Ticket Booking Made Simple</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-accent: #e50914;
        --card-bg: #161d2f;
        --body-bg: #0b0f19;
        --border-color: #232d42;
      }
      body {
        background-color: var(--body-bg);
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
      }
      .navbar {
        background: rgba(11, 15, 25, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
      }
      .movie-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      .movie-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        border-color: #e5091488;
      }
      .screen-indicator {
        height: 6px;
        background: linear-gradient(90deg, rgba(229,9,20,0) 0%, #e50914 50%, rgba(229,9,20,0) 100%);
        border-radius: 4px;
        box-shadow: 0 4px 20px #e50914;
      }
      .seat {
        width: 38px;
        height: 38px;
        margin: 5px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .seat-available {
        background-color: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
      }
      .seat-available:hover {
        background-color: #3b82f6;
        color: #ffffff;
        border-color: #3b82f6;
        transform: scale(1.1);
      }
      .seat-selected {
        background-color: #22c55e !important;
        color: #ffffff !important;
        border: 1px solid #16a34a !important;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
        transform: scale(1.08);
      }
      .seat-booked {
        background-color: #334155 !important;
        color: #64748b !important;
        border: 1px solid #1e293b !important;
        cursor: not-allowed;
        opacity: 0.45;
        text-decoration: line-through;
      }
      .badge-genre {
        background: rgba(229, 9, 20, 0.15);
        color: #ff6b6b;
        border: 1px solid rgba(229, 9, 20, 0.3);
      }
      .ticket-stub {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px dashed #475569;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
